<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#5b7a94"/>
    </marker>
  </defs>
  <rect width="1440" height="920" fill="#eef4f8"/>

  <text x="720" y="56" font-size="38" font-weight="bold" fill="#22384f" text-anchor="middle">玻璃房子与三道门</text>
  <text x="720" y="90" font-size="17" fill="#6b8299" text-anchor="middle">dot 看得见外面的世界，但所有出网流量都得过门卫这一关</text>

  <!-- ===== 左侧场景 ===== -->
  <rect x="40" y="118" width="770" height="560" rx="20" fill="#dbe9f2" stroke="#bcd2e0" stroke-width="2"/>
  <path d="M40,608 H810 V658 Q810,678 790,678 H60 Q40,678 40,658 Z" fill="#c8dce8"/>

  <!-- 声波反弹（无直连） -->
  <circle cx="80" cy="470" r="6" fill="#7a93a8"/>
  <path d="M98,452 a26,26 0 0 1 0,36" fill="none" stroke="#8aa3b5" stroke-width="4" stroke-linecap="round"/>
  <path d="M112,440 a42,42 0 0 1 0,60" fill="none" stroke="#8aa3b5" stroke-width="4" stroke-linecap="round"/>
  <path d="M126,428 a58,58 0 0 1 0,84" fill="none" stroke="#8aa3b5" stroke-width="4" stroke-linecap="round"/>
  <rect x="138" y="434" width="46" height="72" rx="8" fill="#b8cfdd" stroke="#6f96b0" stroke-width="2.5"/>
  <line x1="148" y1="458" x2="174" y2="484" stroke="#c25a5a" stroke-width="6" stroke-linecap="round"/>
  <line x1="174" y1="458" x2="148" y2="484" stroke="#c25a5a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="98" cy="392" r="17" fill="#c25a5a"/>
  <text x="98" y="399" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="112" y="556" font-size="13" fill="#7a93a8" text-anchor="middle">喊声撞在玻璃上</text>

  <!-- 玻璃房子 -->
  <rect x="150" y="330" width="380" height="278" rx="16" fill="rgba(160,205,230,0.30)" stroke="#6f96b0" stroke-width="3"/>
  <path d="M132,334 L340,224 L548,334 Z" fill="rgba(160,205,230,0.40)" stroke="#6f96b0" stroke-width="3" stroke-linejoin="round"/>
  <line x1="200" y1="560" x2="296" y2="400" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <line x1="244" y1="580" x2="322" y2="430" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

  <!-- 机器人 dot -->
  <line x1="298" y1="392" x2="298" y2="366" stroke="#5b7a94" stroke-width="3"/>
  <circle cx="298" cy="358" r="7" fill="#57b8b0"/>
  <rect x="250" y="392" width="96" height="74" rx="20" fill="#ffffff" stroke="#5b7a94" stroke-width="3"/>
  <circle cx="278" cy="424" r="7" fill="#2e5f8a"/>
  <circle cx="318" cy="424" r="7" fill="#2e5f8a"/>
  <path d="M284,444 Q298,455 312,444" fill="none" stroke="#2e5f8a" stroke-width="3" stroke-linecap="round"/>
  <rect x="214" y="486" width="22" height="56" rx="11" fill="#f0f6fa" stroke="#5b7a94" stroke-width="3"/>
  <rect x="360" y="486" width="22" height="56" rx="11" fill="#f0f6fa" stroke="#5b7a94" stroke-width="3"/>
  <rect x="240" y="470" width="116" height="110" rx="22" fill="#f0f6fa" stroke="#5b7a94" stroke-width="3"/>
  <rect x="272" y="498" width="52" height="28" rx="9" fill="#57b8b0"/>
  <text x="298" y="518" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">dot</text>

  <!-- 唯一的门 -->
  <rect x="445" y="470" width="64" height="138" rx="10" fill="#8fb3c9" stroke="#5b7a94" stroke-width="2.5"/>
  <circle cx="496" cy="545" r="4" fill="#2e5f8a"/>
  <rect x="418" y="436" width="118" height="26" rx="13" fill="#2e5f8a"/>
  <text x="477" y="454" font-size="14" fill="#ffffff" text-anchor="middle">唯一出口</text>

  <!-- 锁链 A：dot ↔ 门卫（青色） -->
  <line x1="346" y1="420" x2="618" y2="420" stroke="#3ba8a0" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M472,414 v-8 a10,10 0 0 1 20,0 v8" fill="none" stroke="#2f8f88" stroke-width="4"/>
  <rect x="466" y="414" width="32" height="26" rx="6" fill="#57b8b0"/>
  <circle cx="482" cy="426" r="3.5" fill="#ffffff"/>

  <!-- 锁链 B：门卫 ↔ 外部（蓝色） -->
  <line x1="670" y1="404" x2="752" y2="222" stroke="#3a6ea5" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M706,314 v-8 a10,10 0 0 1 20,0 v8" fill="none" stroke="#2e5f8a" stroke-width="4"/>
  <rect x="700" y="314" width="32" height="26" rx="6" fill="#3a6ea5"/>
  <circle cx="716" cy="326" r="3.5" fill="#ffffff"/>
  <circle cx="694" cy="356" r="17" fill="#3a6ea5"/>
  <text x="694" y="363" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 外部服务云 -->
  <g stroke="#7a93a8" stroke-width="3" fill="#f4f9fc">
    <circle cx="736" cy="186" r="22"/>
    <circle cx="766" cy="176" r="26"/>
    <circle cx="792" cy="190" r="20"/>
    <rect x="724" y="188" width="82" height="24" rx="12" stroke="none"/>
    <path d="M724,200 h82" stroke="none"/>
  </g>
  <path d="M714,206 a22,22 0 0 1 22,-22" fill="none" stroke="#7a93a8" stroke-width="3"/>
  <text x="764" y="244" font-size="13" fill="#5b7a94" text-anchor="middle">外部服务</text>

  <!-- 门卫 -->
  <rect x="622" y="560" width="16" height="48" rx="6" fill="#2b4a68"/>
  <rect x="652" y="560" width="16" height="48" rx="6" fill="#2b4a68"/>
  <rect x="606" y="452" width="78" height="116" rx="18" fill="#3a6ea5" stroke="#2e5f8a" stroke-width="2"/>
  <rect x="606" y="520" width="78" height="10" fill="#2b4a68"/>
  <circle cx="645" cy="420" r="27" fill="#f2d8bd" stroke="#d9b48f" stroke-width="2"/>
  <rect x="622" y="372" width="46" height="26" rx="8" fill="#2e5f8a"/>
  <rect x="612" y="394" width="66" height="10" rx="5" fill="#2e5f8a"/>
  <circle cx="636" cy="420" r="2.6" fill="#22384f"/>
  <circle cx="654" cy="420" r="2.6" fill="#22384f"/>
  <path d="M638,432 Q645,437 652,432" fill="none" stroke="#22384f" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 手臂 + 拆开的信 -->
  <rect x="576" y="470" width="40" height="14" rx="7" fill="#3a6ea5"/>
  <rect x="546" y="438" width="34" height="20" rx="3" fill="#fdf6e3" stroke="#d9c9a8" stroke-width="1.5"/>
  <rect x="538" y="456" width="50" height="34" rx="4" fill="#ffffff" stroke="#8aa3b5" stroke-width="2"/>
  <path d="M538,458 L563,476 L588,458" fill="none" stroke="#8aa3b5" stroke-width="2"/>
  <text x="645" y="640" font-size="15" font-weight="bold" fill="#2b4a68" text-anchor="middle">门卫 · 出网代理</text>

  <!-- CONNECT 走廊与任意端口 -->
  <path d="M509,539 H700" fill="none" stroke="#3ba8a0" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M700,539 C726,539 730,492 748,488" fill="none" stroke="#3ba8a0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr1)"/>
  <path d="M700,539 H744" fill="none" stroke="#3ba8a0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr1)"/>
  <path d="M700,539 C726,539 730,590 748,592" fill="none" stroke="#3ba8a0" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr1)"/>
  <g fill="#8fb3c9" stroke="#5b7a94" stroke-width="2">
    <rect x="750" y="464" width="34" height="48" rx="6"/>
    <rect x="750" y="524" width="34" height="48" rx="6"/>
    <rect x="750" y="584" width="34" height="48" rx="6"/>
  </g>
  <circle cx="566" cy="505" r="17" fill="#3ba8a0"/>
  <text x="566" y="512" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="628" y="524" font-size="14" font-weight="bold" fill="#2f8f88" text-anchor="middle">CONNECT 走廊 · 任意端口都通</text>

  <!-- ===== 右侧三张门卡 ===== -->
  <!-- 卡 1 -->
  <rect x="840" y="120" width="560" height="182" rx="18" fill="#fbfdfe" stroke="#c3d4e0" stroke-width="2"/>
  <rect x="840" y="138" width="8" height="146" rx="4" fill="#c25a5a"/>
  <circle cx="896" cy="164" r="19" fill="#c25a5a"/>
  <text x="896" y="171" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="930" y="172" font-size="21" font-weight="bold" fill="#22384f">门一 · 没有直连</text>
  <text x="872" y="216" font-size="16" fill="#40566b">直连外部地址，不到 1 毫秒就被打回——本地规则</text>
  <text x="872" y="242" font-size="16" fill="#40566b">拒收，包根本没出机器。这是设计，不是故障。</text>
  <text x="872" y="278" font-size="14" fill="#8aa3b5">朝窗外喊一嗓子，听见的只有自己的回声</text>

  <!-- 卡 2 -->
  <rect x="840" y="318" width="560" height="182" rx="18" fill="#fbfdfe" stroke="#c3d4e0" stroke-width="2"/>
  <rect x="840" y="336" width="8" height="146" rx="4" fill="#3ba8a0"/>
  <circle cx="896" cy="362" r="19" fill="#3ba8a0"/>
  <text x="896" y="369" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="930" y="370" font-size="21" font-weight="bold" fill="#22384f">门二 · CONNECT 介绍信</text>
  <text x="872" y="414" font-size="16" fill="#40566b">报出目标（如 your-domain.example），前台替你接通，</text>
  <text x="872" y="440" font-size="16" fill="#40566b">随后把线路让给你。这是 HTTP 代理的标准动作。</text>
  <text x="872" y="476" font-size="14" font-weight="bold" fill="#2f8f88">端口不挑食——任意端口都放行，这是一切花活的立足点</text>

  <!-- 卡 3 -->
  <rect x="840" y="516" width="560" height="182" rx="18" fill="#fbfdfe" stroke="#c3d4e0" stroke-width="2"/>
  <rect x="840" y="534" width="8" height="146" rx="4" fill="#3a6ea5"/>
  <circle cx="896" cy="560" r="19" fill="#3a6ea5"/>
  <text x="896" y="567" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="930" y="568" font-size="21" font-weight="bold" fill="#22384f">门三 · 门卫拆信（TLS 中间人）</text>
  <text x="872" y="612" font-size="16" fill="#40566b">你和门卫之间一把锁，门卫和对面之间另一把锁；</text>
  <text x="872" y="638" font-size="16" fill="#40566b">信封会被拆开检查，包括里面的密钥和 token。</text>
  <text x="872" y="674" font-size="14" fill="#8aa3b5">他同时替你把关对面：自签证书会被直接拒掉（502）</text>

  <!-- ===== 角落剪影对比 ===== -->
  <rect x="40" y="712" width="665" height="96" rx="16" fill="#f7ecec" stroke="#c98a8a" stroke-width="2"/>
  <rect x="70" y="742" width="46" height="32" rx="4" fill="#ffffff" stroke="#a97b7b" stroke-width="2"/>
  <path d="M70,744 L93,762 L116,744" fill="none" stroke="#a97b7b" stroke-width="2"/>
  <path d="M132,758 a16,16 0 1 1 -8,-14" fill="none" stroke="#c25a5a" stroke-width="3" marker-end="url(#arr1)"/>
  <text x="168" y="752" font-size="19" font-weight="bold" fill="#a14f4f">被退回的信</text>
  <text x="168" y="782" font-size="15" fill="#7a5a5a">非 HTTP 载荷：门卫看不懂，静默丢弃——零回复不是报错</text>

  <rect x="735" y="712" width="665" height="96" rx="16" fill="#e6f3ec" stroke="#7bb894" stroke-width="2"/>
  <circle cx="782" cy="758" r="22" fill="none" stroke="#3f9e6e" stroke-width="3"/>
  <path d="M772,748 q10,-8 20,0 l4,6 q-4,10 -12,14 q-10,-4 -16,-14 Z" fill="#3f9e6e"/>
  <line x1="816" y1="758" x2="856" y2="758" stroke="#3f9e6e" stroke-width="3" marker-end="url(#arr1)"/>
  <line x1="856" y1="772" x2="816" y2="772" stroke="#3f9e6e" stroke-width="3" marker-end="url(#arr1)"/>
  <text x="876" y="752" font-size="19" font-weight="bold" fill="#2f7a55">被打通的通话线</text>
  <text x="876" y="782" font-size="15" fill="#4a6b58">WebSocket 升级 101 成功：长连放行，门卫只管搬字节</text>

  <!-- 口诀 -->
  <rect x="40" y="830" width="1360" height="56" rx="28" fill="#2e5f8a"/>
  <text x="720" y="866" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">速记口诀：HTTP 能过 · WebSocket 能长聊 · 其他皆死</text>
</svg>
